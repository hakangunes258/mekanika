<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting…</title>

    <!-- GitHub Pages serves this file for every path it has no file for: a
         calculator deep link (/key-connection), a shared calculation
         (/key-connection#s=…), or the /auth/callback that Google/Supabase returns
         to with the session in the #fragment. It stashes the original URL and
         hands over to index.html, which restores it before Blazor boots.

         The redirect MUST be script-driven. This page used to rely on
         <meta http-equiv="refresh"> alone, and browsers are free to delay or
         ignore that hint: deep links intermittently stalled here without the
         browser ever requesting "/" at all. That silently broke every Share Link
         and every Google sign-in. location.replace() fires immediately and also
         keeps this page out of the back-button history. -->
    <script>
        (function () {
            var target = '/';

            // Never bounce off the site root: if "/" itself ever 404s, replacing
            // it with "/" again would spin forever.
            if (location.pathname === target) return;

            // Storage can be unavailable (privacy mode, blocked cookies). Losing
            // the deep link is bad, but failing to redirect at all is worse - so
            // this must never stop the redirect below.
            try {
                sessionStorage.redirect = location.href;
            } catch (e) { }

            location.replace(target);
        })();
    </script>

    <!-- Scripts disabled: at least get the visitor to the site instead of
         leaving them on a blank page. The deep link cannot be preserved here. -->
    <noscript>
        <meta http-equiv="refresh" content="0;URL='/'">
    </noscript>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
        }

        .box { text-align: center; padding: 24px; }
        .box p { margin: 0 0 12px; font-size: 15px; }
        .box a { color: #1565c0; }
    </style>
</head>
<body>
    <div class="box">
        <p>Redirecting…</p>
        <p><a href="/">Continue to Mekanika</a> if this page does not move on its own.</p>
    </div>
</body>
</html>
