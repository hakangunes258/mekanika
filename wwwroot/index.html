    <base href="/" />

    <!-- SPA deep-link restore. On GitHub Pages an unknown path (a shared calculator
         link, or the /auth/callback that Google/Supabase returns to with the session
         in the #fragment) is served 404.html, which stashes the full original URL in
         sessionStorage and refreshes to "/". Restore it here BEFORE Blazor boots, so
         the router and the auth callback see the original path and fragment. Without
         this the tokens in the fragment are lost and sign-in silently fails. -->
    <script>
        (function () {
            // Wrapped: sessionStorage throws outright when storage is blocked, and
            // an exception here would run before Blazor boots and take the whole
            // app down. A lost deep link must never cost the visitor the site.
            try {
                var r = sessionStorage.redirect;
                if (r) {
                    delete sessionStorage.redirect;
                    if (r !== location.href) history.replaceState(null, null, r);
                }
            } catch (e) { }
        })();
    </script>

    <link rel="icon" type="image/png" href="logo.png" />

    <!-- Bump BOTH ?v= numbers whenever EITHER stylesheet changes, and keep them in
         lockstep - browsers cache linked CSS aggressively and a stale sheet fails
         silently. This bit once: modern-icons.css gained the schematic-modal styles
         but kept ?v=5, so returning visitors got the old file and the modal rendered
         as unstyled markup dumped into the middle of the form. Same number on both
         means there is one thing to remember, not two. -->
    <link href="css/modern-icons.css?v=19" rel="stylesheet" />
    <link href="css/app.css?v=19" rel="stylesheet" />

    </script>

        <a class="dismiss">🗙</a>
    </div>

    <!-- Bump the ?v= on ALL of the app scripts below together whenever ANY of them
         changes, exactly like the two stylesheets above: one number to remember, not
         six. These carried no version at all until the analytics/seo/feedback files
         were repaired, which would have left returning visitors running the cached
         broken copies and made the fix look like it did nothing. viewer3d.js and the
         stylesheets keep their own separate numbers. -->

    <!-- Analytics Wrapper (BEFORE Blazor scripts) -->
    <script src="js/analytics.js?v=1"></script>

    <!-- Auth storage helper. Must load BEFORE Blazor, because the persisted session is
         restored during host startup (Program.cs) before the app's first render. -->
    <script src="js/auth.js?v=1"></script>

    <!-- Core Blazor Framework -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Application Scripts -->
    <script src="js/seo.js?v=1"></script>
    <script src="js/feedback.js?v=1"></script>
    <script src="js/share.js?v=1"></script>

    <!-- 3D geometry viewer. This file is small; it lazy-loads three.js (~600 KB)
         only when the user actually opens a 3D view.
         Bump ?v= when it changes - same reason as the stylesheets above. Without it
         a returning visitor keeps running the cached copy; that matters here because
         a stale viewer draws a WRONG model rather than failing visibly. -->
    <!-- viewer3d.js carries its OWN cache version, separate from the two stylesheets above.
         Bump it whenever the viewer changes, or the browser keeps the old builders and the
         fix looks like it did nothing. -->
    <script src="js/viewer3d.js?v=3" defer></script>

    <!-- PDF Generator - Load Last (only needed for export feature) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
    <script src="pdfGenerator.js?v=1" defer></script>
</body>
