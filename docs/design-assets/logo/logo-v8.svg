<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <pattern id="hatch8" patternUnits="userSpaceOnUse" width="3.5" height="3.5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="3.5" stroke="#1e3a5f" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- M -->
  <path d="M15 22 L15 78 L24 78 L24 40 L37 62 L50 40 L50 78 L59 78 L59 22 L48 22 L37 46 L26 22 Z" 
        fill="url(#hatch8)" stroke="#1e3a5f" stroke-width="2"/>
  
  <!-- E -->
  <path d="M70 22 L70 78 L102 78 L102 70 L79 70 L79 54 L98 54 L98 46 L79 46 L79 30 L102 30 L102 22 Z" 
        fill="url(#hatch8)" stroke="#1e3a5f" stroke-width="2"/>
  
  <!-- K -->
  <path d="M112 22 L112 78 L121 78 L121 54 L143 78 L157 78 L132 50 L155 22 L141 22 L121 48 L121 22 Z" 
        fill="url(#hatch8)" stroke="#1e3a5f" stroke-width="2"/>
  
  <!-- A with gear -->
  <path d="M164 78 L185 22 L197 22 L218 78 L208 78 L202 62 L180 62 L174 78 Z M183 54 L199 54 L191 32 Z" 
        fill="url(#hatch8)" stroke="#1e3a5f" stroke-width="2"/>
  
  <!-- Cross-section style gear -->
  <g transform="translate(191, 47)">
    <!-- Addendum circle (tooth tips) -->
    <circle r="14" fill="none" stroke="#1e3a5f" stroke-width="0.8" stroke-dasharray="2,2"/>
    <!-- Pitch circle -->
    <circle r="11" fill="none" stroke="#1e3a5f" stroke-width="1.8"/>
    <!-- Dedendum circle (tooth roots) -->
    <circle r="8" fill="none" stroke="#1e3a5f" stroke-width="0.8"/>
    <!-- Teeth as simple lines -->
    <g stroke="#1e3a5f" stroke-width="2">
      <line x1="0" y1="-8" x2="0" y2="-14"/>
      <line x1="5.7" y1="-5.7" x2="9.9" y2="-9.9"/>
      <line x1="8" y1="0" x2="14" y2="0"/>
      <line x1="5.7" y1="5.7" x2="9.9" y2="9.9"/>
      <line x1="0" y1="8" x2="0" y2="14"/>
      <line x1="-5.7" y1="5.7" x2="-9.9" y2="9.9"/>
      <line x1="-8" y1="0" x2="-14" y2="0"/>
      <line x1="-5.7" y1="-5.7" x2="-9.9" y2="-9.9"/>
    </g>
    <!-- Bore -->
    <circle r="3" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
    <circle r="1" fill="#1e3a5f"/>
  </g>
  
  <!-- N -->
  <path d="M230 22 L230 78 L239 78 L239 42 L264 78 L273 78 L273 22 L264 22 L264 58 L239 22 Z" 
        fill="url(#hatch8)" stroke="#1e3a5f" stroke-width="2"/>
  
  <!-- I -->
  <path d="M285 22 L285 78 L294 78 L294 22 Z" 
        fill="url(#hatch8)" stroke="#1e3a5f" stroke-width="2"/>
  
  <!-- K -->
  <path d="M306 22 L306 78 L315 78 L315 54 L337 78 L351 78 L326 50 L349 22 L335 22 L315 48 L315 22 Z" 
        fill="url(#hatch8)" stroke="#1e3a5f" stroke-width="2"/>
  
  <!-- A -->
  <path d="M358 78 L379 22 L391 22 L412 78 L402 78 L396 62 L374 62 L368 78 Z M377 54 L393 54 L385 32 Z" 
        fill="url(#hatch8)" stroke="#1e3a5f" stroke-width="2"/>
  
  <!-- DIMENSION LEFT - Standard ISO arrows -->
  <g stroke="#1e3a5f" stroke-width="0.5">
    <!-- Extension lines (gap at start) -->
    <line x1="12" y1="22" x2="3" y2="22"/>
    <line x1="12" y1="78" x2="3" y2="78"/>
    <!-- Dimension line with center gap -->
    <line x1="6" y1="22" x2="6" y2="43"/>
    <line x1="6" y1="57" x2="6" y2="78"/>
    <!-- Arrow heads (closed, filled) -->
    <polygon points="6,22 4,27 8,27" fill="#1e3a5f"/>
    <polygon points="6,78 4,73 8,73" fill="#1e3a5f"/>
  </g>
  
  <!-- DIMENSION BOTTOM -->
  <g stroke="#1e3a5f" stroke-width="0.5">
    <!-- Extension lines -->
    <line x1="70" y1="81" x2="70" y2="93"/>
    <line x1="157" y1="81" x2="157" y2="93"/>
    <!-- Dimension line -->
    <line x1="70" y1="89" x2="105" y2="89"/>
    <line x1="122" y1="89" x2="157" y2="89"/>
    <!-- Arrow heads -->
    <polygon points="70,89 75,87 75,91" fill="#1e3a5f"/>
    <polygon points="157,89 152,87 152,91" fill="#1e3a5f"/>
  </g>
  
  <!-- DIMENSION TOP (over gear) -->
  <g stroke="#1e3a5f" stroke-width="0.5">
    <!-- Extension lines -->
    <line x1="164" y1="19" x2="164" y2="7"/>
    <line x1="218" y1="19" x2="218" y2="7"/>
    <!-- Dimension line -->
    <line x1="164" y1="11" x2="184" y2="11"/>
    <line x1="198" y1="11" x2="218" y2="11"/>
    <!-- Arrow heads -->
    <polygon points="164,11 169,9 169,13" fill="#1e3a5f"/>
    <polygon points="218,11 213,9 213,13" fill="#1e3a5f"/>
  </g>
  
  <!-- DIMENSION RIGHT -->
  <g stroke="#1e3a5f" stroke-width="0.5">
    <line x1="415" y1="22" x2="423" y2="22"/>
    <line x1="415" y1="78" x2="423" y2="78"/>
    <line x1="419" y1="22" x2="419" y2="43"/>
    <line x1="419" y1="57" x2="419" y2="78"/>
    <polygon points="419,22 417,27 421,27" fill="#1e3a5f"/>
    <polygon points="419,78 417,73 421,73" fill="#1e3a5f"/>
  </g>
  
  <!-- Clean ruler -->
  <g stroke="#1e3a5f" stroke-width="0.7" opacity="0.6">
    <line x1="285" y1="8" x2="351" y2="8"/>
    <line x1="285" y1="5" x2="285" y2="11"/>
    <line x1="296" y1="7" x2="296" y2="9"/>
    <line x1="307" y1="5" x2="307" y2="11"/>
    <line x1="318" y1="7" x2="318" y2="9"/>
    <line x1="329" y1="5" x2="329" y2="11"/>
    <line x1="340" y1="7" x2="340" y2="9"/>
    <line x1="351" y1="5" x2="351" y2="11"/>
  </g>
</svg>
