name: Deploy to GitHub Pages

# Builds the Blazor WebAssembly app and publishes it to GitHub Pages on every
# push to `source`. Replaces the manual "publish → copy into gh-pages worktree →
# commit → push" routine.
#
# ONE-TIME SETUP (required before the first run can go live):
#   GitHub → repo Settings → Pages → "Build and deployment" →
#   Source: change from "Deploy from a branch" to "GitHub Actions".
# The custom domain (mekanika.org) stays configured; nothing else changes.
# After that, the gh-pages branch is no longer used to serve the site.

on:
  push:
    branches: [ source ]
  workflow_dispatch:        # allows a manual run from the Actions tab

# Least privilege: read the repo, write a Pages deployment, mint the OIDC token
# that actions/deploy-pages uses to authenticate to the Pages service.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the duplicated result-table CSS has not drifted
        # Eleven calculators declare the same .results-table column rules in their
        # own <style> block. They had quietly diverged into 40/15/25/20 and
        # 45/15/25/15, which only shows when two pages are put side by side.
        run: node tools/check-table-css.mjs

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        # Target the project, not the .sln (the solution rejects -o with a warning).
        # A standard WASM publish (no AOT) needs no extra workload.
        run: dotnet publish MechanicalCalculatorWeb.csproj -c Release -o publish

      - name: Generate a static HTML file per route
        # GitHub Pages has no SPA rewrite: without this every calculator URL is
        # answered by 404.html with an HTTP 404, so the routes in sitemap.xml are
        # not indexable and link previews fall back to the site-level tags with a
        # canonical pointing at the home page. The generator reads its route list
        # from sitemap.xml and its metadata from ModuleMetadataService.cs, and
        # fails if the two disagree - so a new module added to one and not the
        # other stops the deploy instead of shipping a page with no description.
        run: node tools/generate-static-pages.mjs --publish publish/wwwroot --repo .

      - name: Verify the generated pages carry their own metadata
        run: |
          cd publish/wwwroot
          status=0

          # Spot-check the deepest and the shallowest of them rather than all 17:
          # the generator already fails hard on a shape it does not recognise, so
          # this is here to catch the case where it silently produced nothing.
          for route in interference-fit gear-pair about; do
            f="$route/index.html"
            test -f "$f" || { echo "::error::$f was not generated"; status=1; continue; }

            grep -q "rel=\"canonical\" href=\"https://mekanika.org/$route/\"" "$f" \
              || { echo "::error file=$f::canonical is not self-referential - the page would be indexed as a copy of the home page"; status=1; }
            grep -q "og:url\" content=\"https://mekanika.org/$route/\"" "$f" \
              || { echo "::error file=$f::og:url still points somewhere else - link previews will be wrong"; status=1; }
            grep -q "SoftwareApplication" "$f" \
              || { echo "::error file=$f::page-level JSON-LD missing"; status=1; }
            grep -q "history.replaceState" "$f" \
              || { echo "::error file=$f::trailing-slash normaliser missing - Pages 301s to the slash form and Blazor's router will not match it, so the app boots blank"; status=1; }
            grep -q "<base href=\"/\" />" "$f" \
              || { echo "::error file=$f::<base href=\"/\"> lost - every asset would resolve under /$route/ and 404"; status=1; }
          done

          # The home page must NOT have been rewritten with a module's metadata.
          grep -q "rel=\"canonical\" href=\"https://mekanika.org/\"" index.html \
            || { echo "::error::index.html lost its own canonical"; status=1; }

          exit $status

      - name: Verify critical Pages files are present
        # Fail loudly if the SPA fallback, custom domain, or Jekyll opt-out is
        # missing, rather than shipping a broken site.
        run: |
          cd publish/wwwroot
          test -f .nojekyll   || { echo "::error::.nojekyll missing"; exit 1; }
          test -f CNAME       || { echo "::error::CNAME missing"; exit 1; }
          test -f 404.html    || { echo "::error::404.html missing"; exit 1; }
          echo "CNAME = $(cat CNAME)"

          # The deep-link fallback is the whole of Share Link and Google sign-in,
          # and it fails SILENTLY - the visitor just sits on "Redirecting...".
          # It once shipped relying on <meta http-equiv="refresh"> alone, which
          # browsers may delay or ignore. Both halves of the handshake must exist.
          grep -q "location.replace" 404.html \
            || { echo "::error::404.html has no script-driven redirect - deep links, Share Links and sign-in will break"; exit 1; }
          grep -q "sessionStorage.redirect" 404.html \
            || { echo "::error::404.html no longer stashes the original URL"; exit 1; }
          grep -q "sessionStorage.redirect" index.html \
            || { echo "::error::index.html no longer restores the deep link before Blazor boots"; exit 1; }

      - name: Verify the site's own JavaScript actually runs
        # Three of these files shipped minified onto a SINGLE line while still
        # containing `//` comments, so the first comment swallowed the rest of the
        # file: seo.js became a SyntaxError and analytics.js/feedback.js lost 99%
        # and 96% of their code. Every caller wraps interop in try/catch and "fails
        # silently", so per-page SEO tags, custom GA4 events and the feedback widget
        # were dead for months with nothing visible to show for it.
        #
        # Two checks, because either one alone misses half of it: node --check finds
        # the unparseable file, and the line count finds the ones that still parse
        # but have had their body commented out.
        run: |
          cd publish/wwwroot
          status=0
          for f in js/*.js pdfGenerator.js; do
            node --check "$f" \
              || { echo "::error file=$f::JavaScript syntax error - this file will not load at all"; status=1; }
            if [ "$(wc -l < "$f")" -lt 2 ]; then
              echo "::error file=$f::single-line JavaScript. A '//' comment anywhere in it comments out the rest of the file. Keep these files formatted; do not minify."
              status=1
            fi
          done
          exit $status

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
